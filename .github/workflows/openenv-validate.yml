name: OpenEnv validation

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install openenv-core
        run: pip install openenv-core==0.2.3

      - name: Validate OpenEnv manifest
        run: openenv validate
